<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Parkinsans:wght@300..800&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libras-il</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h1>Libras-il</h1>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="about.html">Sobre</a></li>
                <li><a href="contact.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <div id="form-container">
        <div class="form-boxs">
            <h2>Entre em contato</h2>

            <form id="contact-form" autocomplete="off">
                <div class="form-group">
                    <label for="username">Nome completo:</label>
                    <input type="text" id="username" name="username" placeholder="Digite seu nome" required>
                </div>

                <div class="form-group">
                    <label for="user-email">E-mail:</label>
                    <input type="email" id="user-email" name="user-email" placeholder="exemplo@email.com" required>
                </div>

                <div class="form-group">
                    <label for="user-age">Idade:</label>
                    <input type="number" id="user-age" name="user-age" placeholder="Digite sua idade" min="1" required>
                </div>

                <div class="form-group">
                    <label for="user-topic">Assunto:</label>
                    <select id="user-topic" name="user-topic" required>
                        <option value="">Selecione um assunto</option>
                        <option value="libras">Aprender Libras</option>
                        <option value="acessibilidade">Acessibilidade</option>
                        <option value="sugestao">Sugestão para o site</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="user-message">Mensagem:</label>
                    <textarea id="user-message" name="user-message" placeholder="Escreva sua mensagem"
                        required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit">Enviar mensagem</button>
                    <button type="reset">Limpar formulário</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Libras-il. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
